services:
  mcp:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/tokens.sqlite
    volumes:
      - mcp_data:/app/data
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mcp

volumes:
  mcp_data:
  caddy_data:
  caddy_config:
